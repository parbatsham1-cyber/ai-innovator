<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Innovator – Global AI Automation</title>

<style>
:root{
  --bg:#060b23;
  --card:#0e1b34;
  --primary:#19c5ff;
  --text:#eaf4ff;
  --muted:#9fb3c8;
  --success:#2dff9d;
}

*{
  box-sizing:border-box;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top, #0b2a4a, var(--bg));
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text);
}

.card{
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg,#0f2446,#081427);
  border-radius:24px;
  padding:32px 26px;
  box-shadow:0 30px 90px rgba(0,0,0,.6);
  text-align:center;
}

h1{
  margin:0 0 6px;
  font-size:28px;
}

.sub{
  color:var(--muted);
  font-size:14px;
  margin-bottom:22px;
}

.price{
  font-size:44px;
  color:var(--primary);
  font-weight:700;
  margin:16px 0;
}

ul{
  list-style:none;
  padding:0;
  margin:18px 0 26px;
  text-align:left;
}

li{
  margin:10px 0;
  font-size:14px;
}

li::before{
  content:"✔ ";
  color:var(--success);
  font-weight:bold;
}

.pay-box{
  margin-top:20px;
}

.secure{
  margin-top:14px;
  font-size:12px;
  color:var(--muted);
}

.footer{
  margin-top:18px;
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="card">
  <h1>AI Automation Service</h1>
  <div class="sub">Global Secure Payment • No Login Required</div>

  <div class="price">₹999</div>

  <ul>
    <li>India + International Cards</li>
    <li>Visa • MasterCard • RuPay</li>
    <li>UPI & Global Payments</li>
    <li>Instant Email Receipt</li>
    <li>100% Secure Checkout</li>
  </ul>

  <!-- 🔐 RAZORPAY PAYMENT BUTTON -->
  <div class="pay-box">
    <form>
      <script
        src="https://checkout.razorpay.com/v1/payment-button.js"
        data-payment_button_id="pl_RsJHnUacaM0dHd"
        async>
      </script>
    </form>
  </div>

  <div class="secure">
    🔒 Secured by Razorpay
  </div>

  <div class="footer">
    © 2025 AI Innovator • All rights reserved
  </div>
</div>

</body>
</html>
