<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Innovator – AI Automation Service</title>

<style>
:root{
  --bg:#050b1e;
  --card:#0c1a2b;
  --primary:#19c5ff;
  --text:#eaf4ff;
  --muted:#9fb3c8;
}

*{
  box-sizing:border-box;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top, #0b2a4a, var(--bg));
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text);
}

.card{
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg,#0e2440,#091628);
  border-radius:22px;
  padding:32px 26px;
  box-shadow:0 25px 80px rgba(0,0,0,.6);
  text-align:center;
}

h1{
  margin:0 0 8px;
  font-size:28px;
}

.sub{
  color:var(--muted);
  font-size:14px;
  margin-bottom:22px;
}

.price{
  font-size:44px;
  color:var(--primary);
  font-weight:700;
  margin:18px 0;
}

ul{
  list-style:none;
  padding:0;
  margin:20px 0 26px;
  text-align:left;
}

li{
  margin:10px 0;
  font-size:14px;
}

li::before{
  content:"✔ ";
  color:#2dff9d;
}

.pay-box{
  margin-top:20px;
}

.footer{
  margin-top:18px;
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="card">
  <h1>AI Automation Service</h1>
  <div class="sub">Global Secure Payment • No Login Required</div>

  <div class="price">₹999</div>

  <ul>
    <li>India + International Cards</li>
    <li>Visa • MasterCard • RuPay</li>
    <li>UPI & Global Payments</li>
    <li>Instant Email Receipt</li>
    <li>100% Secure Checkout</li>
  </ul>

  <div class="pay-box">
    <form>
      <script 
        src="https://checkout.razorpay.com/v1/payment-button.js"
        data-payment_button_id="pl_RsJHnUacaM0dHd"
        async>
      </script>
    </form>
  </div>

  <div class="footer">
    🔒 Payments powered by Razorpay<br>
    © 2025 AI Innovator
  </div>
</div>

</body>
</html>
