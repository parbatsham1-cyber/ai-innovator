<!DOCTYPE html>      
<html lang="en">      
<head>

<title>Innovator AI – Global AI Automation</title>      
      
<style>      
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}      
body{background:linear-gradient(180deg,#050b1e,#020617);color:#fff}      
      
/* HEADER */      
header{      
display:flex;justify-content:space-between;align-items:center;      
padding:20px 40px      
}      
.logo{font-size:28px;font-weight:700;color:#39c6ff}      
nav a{color:#aaa;margin-left:20px;text-decoration:none}      
nav a:hover{color:#fff}      
      
/* CTA */      
.cta-btn{      
margin-left:25px;      
padding:8px 18px;      
border-radius:20px;      
background:#39c6ff;      
color:#000 !important;      
font-weight:600;      
font-size:14px      
}      
.cta-btn:hover{background:#5ed4ff}      
      
/* HERO */      
.hero{text-align:center;padding:80px 20px}      
.hero h1{font-size:42px;margin-bottom:15px}      
.hero p{color:#bbb;font-size:18px}      
      
/* PRICING */      
.section{padding:60px 20px;text-align:center}      
.section h2{font-size:32px;margin-bottom:40px}      
.cards{display:flex;gap:25px;justify-content:center;flex-wrap:wrap}      
.card{      
background:#0b132b;border-radius:16px;      
padding:30px;width:300px;      
box-shadow:0 0 20px rgba(0,255,255,.1)      
}      
.card h3{font-size:22px}      
.price{font-size:40px;color:#39c6ff;margin:15px 0}      
.card p{color:#ccc;margin:6px 0}      
.pay-btn{margin-top:15px}      
      
/* GLOBAL */      
.flags{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;font-size:18px}      
      
/* FOOTER */      
footer{text-align:center;padding:30px 15px;color:#aaa;font-size:14px}      
      
/* CONTACT */      
.contact-info{      
margin-top:10px;      
color:#ccc;      
font-size:15px      
}      
.contact-info a{color:#39c6ff;text-decoration:none}      
      
/* BOT */      
#botIcon{      
position:fixed;bottom:20px;right:20px;      
width:60px;height:60px;border-radius:50%;      
background:#39c6ff;display:flex;      
justify-content:center;align-items:center;      
font-size:30px;cursor:pointer;z-index:999      
}      
#chatBox{      
position:fixed;bottom:90px;right:20px;      
width:320px;max-height:420px;      
background:#0b132b;border-radius:14px;      
display:none;flex-direction:column;      
overflow:hidden;z-index:999      
}      
#chatHeader{background:#39c6ff;color:#000;padding:12px;font-weight:bold}      
#chatMessages{flex:1;padding:10px;overflow-y:auto;font-size:14px}      
.msg{margin-bottom:8px}      
.user{color:#39c6ff}      
.bot{color:#fff}      
#chatInput{display:flex;border-top:1px solid #222}      
#chatInput input{flex:1;padding:10px;border:none;outline:none}      
#chatInput button{padding:10px 15px;border:none;background:#39c6ff;cursor:pointer}      
</style>      
</head>      
      
<body>      
<!-- 🔹 BODY CODE UNCHANGED 🔹 -->
</body>      
</html>
