.hero{text-align:center;padding:80px 20px}

.section{padding:60px 20px;text-align:center}    
.section h2{font-size:32px;margin-bottom:40px}

#botIcon{position:fixed;bottom:20px;right:20px;width:60px;height:60px;border-radius:50%;background:#39c6ff;display:flex;justify-content:center;align-items:center;font-size:30px;cursor:pointer;z-index:999}    
#chatBox{position:fixed;bottom:90px;right:20px;width:320px;max-height:420px;background:#0b132b;border-radius:14px;display:none;flex-direction:column;overflow:hidden;z-index:999}    
#chatHeader{background:#39c6ff;color:#000;padding:12px;font-weight:bold}    
#chatMessages{flex:1;padding:10px;overflow-y:auto;font-size:14px}    
.msg{margin-bottom:8px}    
.user{color:#39c6ff}    
.bot{color:#fff}    
#chatInput{display:flex;border-top:1px solid #222}    
#chatInput input{flex:1;padding:10px;border:none;outline:none}

<body>    

<!-- {{ { "text": $json.text } }} -->

<header>    
<div class="logo">Innovator AI</div>    
<nav>    
<a href="#pricing">Pricing</a>    
<a href="#contact">Contact</a>    
<a href="#pricing" class="cta-btn">Get Started</a>    
</nav>    
</header>    

<section class="hero">    
<h1>Global AI Automation for Businesses</h1>    
<p>We build AI Automation, Chatbots & Business AI Systems worldwide.</p>    
</section>    

<div id="botIcon">🤖</div>    

<div id="chatBox">    
<div id="chatHeader">Innovator AI Assistant</div>    
<div id="chatMessages">    
<div class="msg bot">Hi 👋 I am Innovator AI Assistant.</div>    
</div>    
<div id="chatInput">    
<input id="userText" placeholder="Ask about services, pricing or process..." />    
<button onclick="sendMsg()">Send</button>    
</div>    
</div>    

<script>    
const botIcon=document.getElementById("botIcon");    
const chatBox=document.getElementById("chatBox");    
botIcon.onclick=()=>{chatBox.style.display=chatBox.style.display==="flex"?"none":"flex"};    

async function sendMsg(){    
let input=document.getElementById("userText");    
let text=input.value.trim();    
if(!text)return;    

let chat=document.getElementById("chatMessages");    
chat.innerHTML+=`<div class="msg user">You: ${text}</div>`;    
input.value="";    

try{    
let res=await fetch("https://innovatorai2025.app.n8n.cloud/webhook/b40420c1-d090-4151-b034-20eb96b60006",{    
method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})    
});    
let data=await res.json();    
let reply=data.reply||data.output||"Jarvis is thinking...";    
chat.innerHTML+=`<div class="msg bot">${reply}</div>`;    
}catch(e){    
chat.innerHTML+=`<div class="msg bot">⚠️ Jarvis temporarily unavailable.</div>`    
}    
}    
</script>    

</body>
