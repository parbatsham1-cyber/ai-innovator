<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Innovator – AI Automation Service</title>

  <style>
    :root{
      --bg:#070f1c;
      --card:#0c1a2b;
      --primary:#19c5ff;
      --text:#eaf4ff;
      --muted:#9fb3c8;
    }

    *{
      box-sizing:border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    }

    body{
      margin:0;
      min-height:100vh;
      background:linear-gradient(120deg,#050b16,#0a1b2f);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:rgba(12,26,43,0.9);
      border-radius:20px;
      padding:30px;
      text-align:center;
      box-shadow:0 0 40px rgba(25,197,255,0.35);
    }

    h1{
      margin:0 0 8px;
      font-size:26px;
      font-weight:700;
    }

    .sub{
      color:var(--muted);
      font-size:14px;
      margin-bottom:25px;
    }

    .price{
      font-size:36px;
      font-weight:800;
      color:var(--primary);
      margin-bottom:20px;
    }

    .features{
      text-align:left;
      margin-bottom:25px;
      font-size:14px;
      color:var(--muted);
    }

    .features li{
      margin:8px 0;
    }

    .secure{
      margin-top:18px;
      font-size:12px;
      color:var(--muted);
    }

    footer{
      margin-top:12px;
      font-size:11px;
      color:#6f8aa5;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>AI Automation Service</h1>
    <div class="sub">Global Secure Payment • No Login Required</div>

    <div class="price">₹999</div>

    <ul class="features">
      <li>✅ India + International Cards</li>
      <li>✅ Visa • MasterCard • RuPay</li>
      <li>✅ UPI & Global Payments</li>
      <li>✅ Instant Email Receipt</li>
      <li>✅ 100% Secure Checkout</li>
    </ul>

    <!-- ===== RAZORPAY PAYMENT BUTTON ===== -->
    <form>
      <script
        src="https://checkout.razorpay.com/v1/payment-button.js"
        data-payment_button_id="pl_RsJHnUacaM0dHd"
        async>
      </script>
    </form>
    <!-- ===== END PAYMENT BUTTON ===== -->

    <div class="secure">
      🔒 Payments powered by Razorpay
    </div>

    <footer>
      © 2025 AI Innovator. All rights reserved.
    </footer>
  </div>

</body>
</html>
